<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Monitor</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--muted:#667085;--line:#d9dde3;--accent:#2457d6;--ok:#137a3f;--okbg:#e6f4ec;--bad:#b42318;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4dc;--info:#1849a9;--infobg:#e8effd;--code:#0f1420;--codefg:#d6e2ff}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--muted:#98a2b3;--line:#2e3542;--accent:#7aa2ff;--ok:#5fd08e;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1714;--warn:#ffcf66;--warnbg:#3a2c0b;--info:#9db8ff;--infobg:#17233d;--code:#0b0e14;--codefg:#d6e2ff}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:17px;margin:0}a{color:var(--accent)}main{max-width:1200px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted)}tr.sel{background:var(--infobg)}tr[data-id]{cursor:pointer}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.PENDING{background:var(--warnbg);color:var(--warn)}.RUNNING{background:var(--infobg);color:var(--info)}.SUCCESS{background:var(--okbg);color:var(--ok)}.FAILED,.REVOKED{background:var(--badbg);color:var(--bad)}
pre{background:var(--code);color:var(--codefg);padding:10px;border-radius:8px;overflow:auto;font-size:12.5px;max-height:420px}
h2{font-size:15px;margin:0 0 8px}h3{font-size:14px;margin:14px 0 6px}.muted{color:var(--muted)}.y{color:var(--ok)}.n{color:var(--bad)}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}button{font:inherit;padding:6px 12px;border-radius:7px;border:1px solid var(--bad);background:transparent;color:var(--bad);cursor:pointer}
</style>
</head>
<body>
<header><h1>Job Monitor</h1><a href="/">← Topology workflow</a><span class="muted">auto-refresh every 5 s</span></header>
<main>
<section><table><thead><tr><th>Status</th><th>Job</th><th>Routers</th><th>Created</th><th>Started</th><th>Finished</th><th>Stage</th></tr></thead><tbody id="rows"></tbody></table></section>
<section id="detail" hidden></section>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let selected = new URLSearchParams(location.search).get("job");
const t = s => s ? s.replace("T", " ").replace("+00:00", " UTC") : "—";
const yn = (b, label) => `<span class="${b ? "y" : "n"}">${b ? "✔" : "✘"} ${esc(label)}</span>`;
async function refresh() {
  const jobs = await (await fetch("/api/jobs")).json();
  if (!selected && jobs.length) selected = jobs[0].id;
  document.getElementById("rows").innerHTML = jobs.map(j => `<tr data-id="${esc(j.id)}" class="${j.id === selected ? "sel" : ""}">
    <td><span class="badge ${esc(j.status)}">${esc(j.status)}</span>${j.revoked ? ' <span class="muted">revoked</span>' : ""}</td><td><code>${esc(j.id.slice(0, 8))}</code></td>
    <td>${esc(j.devices.join(", "))}</td><td>${t(j.created_at)}</td><td>${t(j.started_at)}</td><td>${t(j.finished_at)}</td><td>${esc(j.stage)}</td></tr>`).join("") ||
    '<tr><td colspan="7" class="muted">No jobs yet.</td></tr>';
  document.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = () => { selected = tr.dataset.id; history.replaceState(null, "", "?job=" + selected); refresh(); });
  const j = jobs.find(x => x.id === selected); if (j) detail(j);
}
function detail(j) {
  const d = document.getElementById("detail"); d.hidden = false;
  const open = new Set([...d.querySelectorAll("details[open]")].map(x => x.dataset.k));
  const routers = j.devices.map(r => {
    const rr = j.router_results[r] || {}, v = j.verification[r];
    const checks = v ? `<p>${yn(v.passed, "verification " + (v.passed ? "passed" : "failed"))} &nbsp;
        ${v.neighbor_full !== undefined ? yn(v.neighbor_full, "neighbour FULL " + (v.neighbors_expected||[]).join(",")) : ""} &nbsp;
        ${v.remote_networks_missing ? yn(!v.remote_networks_missing.length, "learned via OSPF: " + (v.remote_networks_expected||[]).join(", ")) : ""} &nbsp;
        ${v.ospf_process_ok !== undefined ? yn(v.ospf_process_ok, "OSPF process") : ""} &nbsp;
        ${v.router_id_ok !== undefined ? yn(v.router_id_ok, "router ID") : ""} &nbsp;
        ${v.static_routes_found ? yn(!v.static_routes_found.length, "no static routes") : ""}</p>
        ${Object.entries(v.ping_remote_pcs||{}).map(([pc, p]) => `<p>${yn(p.success_percent > 0, `ping ${pc} ${p.ip}: ${p.success_percent}%`)} <span class="muted">(info)</span></p>`).join("")}
        ${(v.problems||[]).length ? `<p class="n">${esc(v.problems.join("; "))}</p>` : ""}` : '<p class="muted">not verified yet</p>';
    const block = (k, title, body) => body ? `<details data-k="${esc(r + k)}" ${open.has(r + k) ? "open" : ""}><summary>${esc(title)}</summary><pre>${esc(body)}</pre></details>` : "";
    return `<h3>${esc(r)} <span class="muted">${esc(rr.host || "")}</span></h3>${checks}
      ${block("cfg", "Deployment output", rr.configuration_output)}
      ${v ? block("nbr", "show ip ospf neighbor", v.show_ip_ospf_neighbor) + block("rt", "show ip route ospf", v.show_ip_route_ospf) + block("pr", "show ip protocols", v.show_ip_protocols) : ""}
      ${block("bk", "Backup: running-config before deployment", rr.backup_running_config)}`;
  }).join("");
  d.innerHTML = `<h2>Job <code>${esc(j.id)}</code> <span class="badge ${esc(j.status)}">${esc(j.status)}</span></h2>
    <p class="muted">plan <code>${esc(j.plan_id)}</code> · worker ${esc(j.worker_id || "—")} · config sha256 <code>${esc(j.config_sha256.slice(0, 16))}…</code>
    ${j.kafka ? ` · Kafka ${esc(j.kafka.topic)} p${esc(j.kafka.partition)} offset ${esc(j.kafka.offset)}` : ""}</p>
    ${j.error ? `<p class="n"><b>Error:</b> ${esc(j.error)}</p>` : ""}
    ${j.status === "FAILED" && !j.revoked ? `<button id="revoke">Revoke plan approval</button> <span class="muted">Recovery: <code>.venv/bin/python worker.py --rollback ${esc(j.plan_id)}</code></span>` : ""}
    <h3>History</h3><table>${(j.history||[]).map(h => `<tr><td>${t(h.at)}</td><td><span class="badge ${esc(h.status)}">${esc(h.status)}</span></td><td>${esc(h.stage)}</td><td>${esc(h.device||"")}</td><td style="white-space:normal">${esc(h.message||"")}</td></tr>`).join("")}</table>
    ${routers}
    <details data-k="km" ${open.has("km") ? "open" : ""}><summary>Kafka message</summary><pre>${esc(JSON.stringify(j.kafka_message, null, 2))}</pre></details>
    <details data-k="raw" ${open.has("raw") ? "open" : ""}><summary>Raw job JSON</summary><pre>${esc(JSON.stringify(j, null, 2))}</pre></details>`;
  const b = document.getElementById("revoke");
  if (b) b.onclick = async () => { if (confirm("Revoke the approval of this plan? It must be reviewed and approved again.")) { await fetch(`/api/jobs/${j.id}/revoke`, {method: "POST"}); refresh(); } };
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
